[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html
markers =
    smoke: core happy-path flows - quick sanity run (pytest -m smoke)
    regression: negative, boundary and secondary flows (pytest -m regression)
    known_defect: test expected to fail because the site deviates from the requirement (xfail)
    fr(id): traceability - the functional requirement ID(s) the test verifies, e.g. fr("FR-01")
